stages:
  - test
  - deploy

image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/archlinux:base-devel

test-x86_64:
  stage: test
  tags:
    - x86_64-linux-kvm-docker
  script:
    - pacman -Syu --noconfirm --needed dbus rustup gsettings-desktop-schemas clang speech-dispatcher cargo-tarpaulin
    - rustup default 1.97.1
    - dbus-run-session cargo tarpaulin --out xml --engine llvm
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: cobertura.xml

test-aarch64:
  stage: test
  image: registry.gitlab.steamos.cloud/holo/holo-core-aarch64-preview/base-devel
  tags:
    - aarch64-linux-docker
  script:
    - pacman -Syu --noconfirm --needed dbus rustup gsettings-desktop-schemas clang speech-dispatcher
    - rustup default 1.97.1
    - dbus-run-session cargo test

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH

fmt:
  stage: test
  tags:
    - x86_64-linux-kvm-docker
  script:
    - pacman -Syu --noconfirm --needed rustup
    - rustup default 1.97.1
    - cargo fmt --check

clippy-x86_64:
  stage: test
  tags:
    - x86_64-linux-kvm-docker
  script:
    - pacman -Syu --noconfirm --needed rustup clang speech-dispatcher
    - rustup default stable
    - cargo clippy -- -Dwarnings
    - cargo clippy --tests -- -Dwarnings

clippy-aarch64:
  stage: test
  image: registry.gitlab.steamos.cloud/holo/holo-core-aarch64-preview/base-devel
  tags:
    - aarch64-linux-docker
  script:
    - pacman -Syu --noconfirm --needed rustup clang speech-dispatcher
    - rustup default stable
    - cargo clippy -- -Dwarnings
    - cargo clippy --tests -- -Dwarnings

proxy:
  stage: test
  tags:
    - x86_64-linux-kvm-docker
  script:
    - pacman -Syu --noconfirm --needed rustup git
    - rustup default 1.97.1
    - cargo install zbus_xmlgen@^6.0
    - cd steamos-manager-proxy/src
    - PATH=$PATH:~/.cargo/bin ./update_proxy.sh
    - git status
    - git diff
    - git diff-index --quiet HEAD

build-x86_64:
  stage: deploy
  tags:
    - x86_64-linux-kvm-docker
  script:
    - pacman -Syu --noconfirm --needed dbus rustup gsettings-desktop-schemas clang speech-dispatcher
    - rustup default 1.97.1
    - make install DESTDIR=build
    - tar --zstd -C build -cvf build.tar.zst .
  artifacts:
    paths:
      - build.tar.zst

build-aarch64:
  stage: deploy
  image: registry.gitlab.steamos.cloud/holo/holo-core-aarch64-preview/base-devel
  tags:
    - aarch64-linux-docker
  script:
    - pacman -Syu --noconfirm --needed dbus rustup gsettings-desktop-schemas clang speech-dispatcher
    - rustup default 1.97.1
    - make install DESTDIR=build
    - tar --zstd -C build -cvf build.tar.zst .
  artifacts:
    paths:
      - build.tar.zst
